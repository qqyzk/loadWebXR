<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Experiment 10_20_70 N=8</title>
    <script src="../lib/my-aframe.js"></script>
  </head>
  <body>
    <!-- TTFF Start Overlay -->
    <div id="ttff-start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
         background: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; align-items: center; 
         justify-content: center; flex-direction: column; color: white; font-family: Arial, sans-serif;">
      <h1 style="font-size: 48px; margin-bottom: 20px;">Experiment 10_20_70 N=8</h1>
      <p style="font-size: 20px; margin-bottom: 40px;">Simulation Scene for Performance Testing</p>
      <button id="ttff-start-button" style="font-size: 24px; padding: 20px 60px; background: #ff6600; 
              border: none; color: white; cursor: pointer; border-radius: 10px; font-weight: bold;">
        START EXPERIENCE
      </button>
    </div>

    <!-- Scene template - will be injected after Start button click -->
    <template id="scene-template">
    <a-scene>
      <!-- Camera -->
      <a-camera position="0 1.6 0">
        <a-entity cursor="rayOrigin: mouse"></a-entity>
      </a-camera>

      <!-- Assets -->
      <a-assets timeout="500000">
      <a-asset-item id="model_1" src="models/model_1.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_2" src="models/model_2.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_3" src="models/model_3.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_4" src="models/model_4.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_5" src="models/model_5.glb" response-type="arraybuffer" priority="2"></a-asset-item>
      <a-asset-item id="model_6" src="models/model_6.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_7" src="models/model_7.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      <a-asset-item id="model_8" src="models/model_8.glb" response-type="arraybuffer" priority="3"></a-asset-item>
      </a-assets>

      <!-- Models -->
    <a-gltf-model src="#model_1" position="3.92 -6.52 6.4" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_2" position="1.99 -6.71 -6.92" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_3" position="-0.42 -7.28 -4.95" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_4" position="-6.46 -6.26 -5.99" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_5" position="-4.73 -6.62 2.41" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_6" position="-3.37 -7.09 1.51" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_7" position="-4.3 -2.95 4.74" scale="0.3 0.3 0.3"></a-gltf-model>
    <a-gltf-model src="#model_8" position="-3.4 6.78 3.93" scale="0.3 0.3 0.3"></a-gltf-model>

      <!-- Audio -->

    </a-scene>
    </template>

    <!-- TTFF Measurement Script -->
    <script src="../ttff-measurement-main.js"></script>
    
    <!-- Scene Injection Script -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var button = document.getElementById('ttff-start-button');
        var overlay = document.getElementById('ttff-start-overlay');
        var template = document.getElementById('scene-template');
        
        button.addEventListener('click', function() {
          // Inject scene from template
          var sceneContent = template.content.cloneNode(true);
          document.body.appendChild(sceneContent);
          
          // Hide overlay
          overlay.style.display = 'none';
        }, true);
      });
    </script>
  </body>
</html>
