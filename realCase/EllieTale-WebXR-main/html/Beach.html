<a-scene editor shadow="type: pcfsoft" stats effects="bloom, fxaa, ssao, godrays"
    bloom="radius: 0.66" fxaa
    godrays="src: #sun; threshold: 0.33; intensity: 2; tint:#FF0000"
    ssao="intensity:10; scale:.2; maxDepth:10; samples:64; radius:1; depthCutoff:100; blurRadius:10"
    renderer="antialias: true; sortObjects: true; maxCanvasWidth: 1920; maxCanvasHeight: 1920; colorManagement: true;">

  <a-camera id="cam" menu position="0 1 -5" rotation="0 -180 0">
    <a-entity cursor="rayOrigin: mouse"></a-entity>
  </a-camera>

  <a-assets timeout="500000">
    <a-asset-item id="helloSound" src="assets/illy_the_fairy/1_Hello_there.wav" preload="none"></a-asset-item>
    <a-asset-item id="enviroSound" src="assets/illy_the_fairy/3_fishing_beach.wav" preload="none"></a-asset-item>
    <a-asset-item id="targetSound" src="assets/illy_the_fairy/15_seashell.wav" preload="none"></a-asset-item>
    <a-asset-item id="infoSound" src="assets/illy_the_fairy/10_point_at.wav" preload="none"></a-asset-item>
    <a-asset-item id="infoSound2" src="assets/illy_the_fairy/11_click_on.wav" preload="none"></a-asset-item>
    <a-asset-item id="infoSounditem" src="assets/illy_the_fairy/7_Yay_This.wav" preload="none"></a-asset-item>
    <a-asset-item id="infoSounditemone" src="assets/illy_the_fairy/8_Awesome_That.wav" preload="none"></a-asset-item>
    <a-asset-item id="infoSounditemtwo" src="assets/illy_the_fairy/9_Woho_This.wav" preload="none"></a-asset-item>
    <a-asset-item id="slowSound" src="assets/illy_the_fairy/11_too_slow.wav" preload="none"></a-asset-item>
    <a-asset-item id="endSound" src="assets/illy_the_fairy/21_have_helped.wav" preload="none"></a-asset-item>
    <a-asset-item id="boxSound" src="assets/illy_the_fairy/13_Uncle_needs.wav" preload="none"></a-asset-item>
    <a-asset-item id="boxSound2" src="assets/illy_the_fairy/20_object.wav" preload="none"></a-asset-item>
    <a-asset-item id="boxSound3" src="assets/illy_the_fairy/14_pick_up.wav" preload="none"></a-asset-item>
    <a-asset-item id="shrimp" src="assets/illy_the_fairy/18_Shrimp.wav" preload="none"></a-asset-item>
    <a-asset-item id="shark" src="assets/illy_the_fairy/19_shark.wav" preload="none"></a-asset-item>
    <a-asset-item id="ship" src="assets/illy_the_fairy/21_ship.wav" preload="none"></a-asset-item>
    <a-asset-item id="fishing" src="assets/illy_the_fairy/23_fishing_rod.wav" preload="none"></a-asset-item>
    <a-asset-item id="whale" src="assets/illy_the_fairy/22_whale.wav" preload="none"></a-asset-item>
    <a-asset-item id="octopus" src="assets/illy_the_fairy/20_octopus.wav" preload="none"></a-asset-item>
    <a-asset-item id="ball" src="assets/illy_the_fairy/14_boxs.wav" preload="none"></a-asset-item>
  </a-assets>

  <!-- HUD / UI -->
  <a-text id="score" value="0" width="20" text="side: double; align: center"
          scale="0.5 0.5 0.5" geometry="primitive:circle"
          material="emissive:#245a8a;transparent: true"
          position="-4.11289 2 -11.07439"></a-text>
  <a-text id="reload" class="menu" text="side: double; align: center"
          scale="0.2 0.2 0.2" geometry="primitive:circle"
          material="transparent: true" position="3 2 -8.24248"></a-text>

  <!--Hands-->
  <a-entity progressive-controls></a-entity>
  <a-entity oculus-quest-controls="hand: left"></a-entity>
  <a-entity oculus-quest-controls="hand: right" thumbstick-logging></a-entity>
  <a-entity laser-controls="hand: right"
            raycaster="objects: .timer,.menu,.Box,#myDistractor; far: 100"></a-entity>

  <!-- Environment -->
  <a-entity id="mybeach"
            progressive-gltf="src: item/Beach_Environment_v1.02.glb"
            shadow animation-mixer position="12 0 -7.13117"></a-entity>
  <a-light type="directional" position="0 6 0"></a-light>
  <a-entity id="updateMe"></a-entity>

  <!-- Targets -->
  <a-entity id="targetone" class="Box"
            progressive-gltf="src: item/Beach_Seashell_lit_v1.02.glb"
            aabb-collider="objects:a-gltf-model,a-box"
            shadow="receive: true"
            position="-1.79 -0.09 3.63" rotation="0 140 0"
            showitem static-body ontriggertarget></a-entity>

  <a-entity id="targettwo" class="Box"
            progressive-gltf="src: item/Beach_Seashell_lit_v1.02.glb"
            aabb-collider="objects:a-gltf-model,a-box"
            shadow="receive: true"
            position="-4.81 0.12 -2.66" rotation="0 0 0"
            showitem static-body ontriggertarget></a-entity>

  <a-entity id="targetthree" class="Box"
            progressive-gltf="src: item/Beach_Seashell_lit_v1.02.glb"
            aabb-collider="objects:a-gltf-model,a-box"
            shadow="receive: true"
            position="2.95 -0.02 -4.76"
            showitem static-body ontriggertarget></a-entity>

  <a-entity id="targetfour" class="Box"
            progressive-gltf="src: item/Beach_Seashell_lit_v1.02.glb"
            aabb-collider="objects:a-gltf-model,a-box"
            shadow="receive: true"
            position="-1.12 0.12 -14.67" rotation="0 0 0"
            showitem static-body ontriggertarget></a-entity>

  <!-- Items -->
  <a-entity id="item" progressive-gltf="src: item/Beach_prop_fishingRod_01.glb"></a-entity>
  <a-sound id="sound1" src="#fishing"></a-sound>

  <a-entity id="itemOne" progressive-gltf="src: item/Beach_prop_sharky_01.glb"></a-entity>
  <a-sound id="sound2" src="#shark"></a-sound>

  <a-entity id="itemTwo" progressive-gltf="src: item/Beach_prop_octopus_01.glb"></a-entity>
  <a-sound id="sound3" src="#octopus"></a-sound>

  <a-entity id="itemThree" progressive-gltf="src: item/Beach_prop_shrimp_01.glb"></a-entity>
  <a-sound id="sound5" src="#shrimp"></a-sound>

  <a-entity id="itemFour" progressive-gltf="src: item/Beach_prop_whale_01.glb"></a-entity>
  <a-sound id="sound4" src="#whale"></a-sound>

  <a-entity id="itemFive" progressive-gltf="src: item/Beach_prop_ship_01.glb"></a-entity>
  <a-sound id="sound5" src="#ship"></a-sound>

  <a-entity id="itemSix" progressive-gltf="src: item/Beach_prop_ball_01.glb"></a-entity>
  <a-sound id="sound6" src="#ball"></a-sound>

  <!-- Fairy -->
  <a-entity id="Fairy"
            progressive-gltf="src: item/Elly_2k_03.glb"
            position="-0.08 1.62 -3"
            aabb-collider="objects: .Box"
            static-body lookat="#cam">
    <a-sound id="helloAud" src="#helloSound"></a-sound>
    <a-sound id="enviroAud" src="#enviroSound"></a-sound>
    <a-sound id="boxAud2" src="#boxSound2"></a-sound>
    <a-sound id="boxAud3" src="#boxSound3"></a-sound>
    <a-sound id="targetAud" src="#targetSound"></a-sound>
    <a-sound id="infoAud2" src="#infoSound2"></a-sound>
  </a-entity>

  <!-- Distractors -->
  <a-entity id="myDistractor"
            progressive-gltf="src: item/Noah_hunter_v1.01.glb"
            visible="false" position="1.75 0.1 -7.22"
            lookat="#cam" clickable static-body
            aabb-collider="objects:a-entity,.Box"></a-entity>

  <a-entity id="noah"
            progressive-gltf="src: item/Noah_hunter_v1.01.glb"
            rotation="0 -85.2 0" position="10.67 0.3 -0.85"
            lookat="#cam" clickable static-body
            aabb-collider="objects:a-entity"></a-entity>

  <a-entity id="distractingPartical"
            progressive-gltf="src: item/Beach_Seashell_particles_half_v1.01.glb"
            visible="false" animation-mixer shadow></a-entity>

  <!-- Stats -->
  <a-text id="selectenvironment" value="Beach" visible="false"></a-text>
  <a-text id="level" value="1" visible="false" position="-20 1 1"></a-text>
  <a-text id="levelTybe" value="open" visible="false" position="-15 1 1"></a-text>
  <a-text id="counter" value="0" visible="false"></a-text>
  <a-text id="taskcounter" value="1" visible="false" position="-30 1 3"></a-text>
  <a-text id="tasktime" value="0" visible="false" position="-35 1 3"></a-text>
  <a-text id="dscounter" value="1" visible="false" position="-40 1 4"></a-text>
  <a-text id="dstime" value="0" visible="false" position="-45 1 4"></a-text>
  <a-text id="inpsCounter" value="0" visible="false" position="-25 1 7"></a-text>
  <a-text id="inps" value="0" visible="false" position="-35 1 7"></a-text>
  <a-text id="session" value="0" visible="false" position="-35 1 7"></a-text>

</a-scene>
