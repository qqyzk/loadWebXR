<!DOCTYPE html>
<html prefix="og: http://ogp.me/ns#" lang="en_US">
  <head>
    <meta charset="utf-8">
    <title>HalloVReen · a webVR experiment for kids by Jorge Fuentes</title>
    <meta name="description" content="It's All Hallow's Eve and the citizens of Creepville are restless! Can you spot them all? A webVR experience by Jorge Fuentes made with A-Frame. Compatible with Google Cardboard up to Oculus Rift and Go, Vive, Gear VR.">
    <meta property="og:title" content="HalloVReen">
    <meta property="og:description" content="It's All Hallow's Eve and the citizens of Creepville are restless! Can you spot them all? A webVR experience by Jorge Fuentes made with A-Frame. Compatible with Google Cardboard up to Oculus Rift and Go, Vive, Gear VR.">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <!-- <meta property="og:url" content="https://www.jorgefuentes.net/projects/halloVReen/"> -->
    <!-- <meta property="og:image" content="https://www.jorgefuentes.net/projects/halloVReen/halloVReen_screenshot.jpg"> -->

    <script src="mylib/my-aframe.js"></script>
    <script src="components/correct-gamma.js"></script>
    <script src="components/aframe-extras.min.js"></script>
    <script src="components/animation-control.js"></script>
    <script src="components/swap-model.js"></script>
    <script src="components/autoplay.js"></script>
    <script src="components/score.js"></script>

    <script>

      var clicksEnabled = false;

    </script>

  </head>
  <body>
    <!-- TTFF Start Overlay -->
    <div id="ttff-start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
         background: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; align-items: center; 
         justify-content: center; flex-direction: column; color: white; font-family: Arial, sans-serif;">
      <h1 style="font-size: 48px; margin-bottom: 20px;">HalloVReen</h1>
      <p style="font-size: 20px; margin-bottom: 40px;">It's All Hallow's Eve and the citizens of Creepville are restless!</p>
      <button id="ttff-start-button" style="font-size: 24px; padding: 20px 60px; background: #ff6600; 
              border: none; color: white; cursor: pointer; border-radius: 10px; font-weight: bold;">
        START EXPERIENCE
      </button>
    </div>

    <!-- Scene template - will be injected after Start button click -->
    <template id="scene-template">
    <a-scene fog="type: linear; color: #597360; near: 2; far: 30;" background="color: #000" correct-gamma>
      <a-assets timeout="30000">
        <a-asset-item id="skeleton" src="models/skeleton.gltf" priority="2" chunked="true" chunk-count="51"></a-asset-item>
        <a-asset-item id="village" src="models/village.gltf" priority="1"></a-asset-item>
        <a-asset-item id="village_trees_outer" src="models/village_trees_outer.gltf" priority="1"></a-asset-item>
        <a-asset-item id="village_trees_middle" src="models/village_trees_middle.gltf" priority="1"></a-asset-item>
        <a-asset-item id="village_trees_inner" src="models/village_trees_inner.gltf" priority="1"></a-asset-item>
        <a-asset-item id="zombi" src="models/zombi.gltf" priority="1"></a-asset-item>
        <a-asset-item id="werewolf" src="models/werewolf.gltf" priority="1"></a-asset-item>
        <a-asset-item id="witch" src="models/witch.gltf" priority="2" chunked="true" chunk-count="18"></a-asset-item>
        <a-asset-item id="vampire" src="models/vampire.gltf" priority="2" chunked="true" chunk-count="23"></a-asset-item>
        <a-asset-item id="pumpkin_happy" src="models/pumpkin_happy.gltf" priority="2" chunked="true" chunk-count="19"></a-asset-item>
        <a-asset-item id="pumpkin_evil" src="models/pumpkin_evil.gltf" priority="2" chunked="true" chunk-count="20"></a-asset-item>
        <a-asset-item id="hand" src="models/hand.gltf" priority="2" chunked="true" chunk-count="46"></a-asset-item>
        <a-asset-item id="feet" src="models/feet.gltf" priority="2" chunked="true" chunk-count="36"></a-asset-item>
        <a-asset-item id="bat" src="models/bat.gltf" priority="1"></a-asset-item>
        
        <!-- Audio Assets -->
        <a-asset-item id="bgsound" src="sounds/bgsound.ogg" response-type="arraybuffer" preload="auto" priority="2"></a-asset-item>
        
        <!-- Individual Sound Effects -->
        <a-asset-item id="batSound" src="sounds/individual/bat.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="feetSound" src="sounds/individual/feet.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="handSound" src="sounds/individual/hand.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="pumpkinLaughSound" src="sounds/individual/pumpkin_laugh.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="skeletonSound" src="sounds/individual/skeleton.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="vampireSound" src="sounds/individual/vampire.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="werewolfSound" src="sounds/individual/werewolf.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="witchLaughSound" src="sounds/individual/witch_laugh.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
        <a-asset-item id="zombiSound" src="sounds/individual/zombi.ogg" response-type="arraybuffer" preload="auto" priority="3"></a-asset-item>
      </a-assets>

      <a-camera>
        <a-entity 
          raycaster="objects: .clickable"
          cursor="fuse: true; fuseTimeout: 150"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
          material="color: white; shader: flat"
        >
          <a-animation begin="cursor-fusing" easing="ease-in" attribute="scale" fill="backwards" from="1 1 1" to="1.5 1.5 1.5" dur="150"></a-animation>
        </a-entity>
      </a-camera>



      <!-- Hidden element to trigger autoplay component -->
      <a-entity autoplay style="display: none;"></a-entity>

      <!-- Background Music -->
      <a-sound id="bgMusic" src="#bgsound" sound-autoplay="false" loop="true" volume="0.2"></a-sound>
      
      <!-- Individual Sound Effects -->
      <a-sound id="batSound" src="#batSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="feetSound" src="#feetSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="handSound" src="#handSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="pumpkinLaughSound" src="#pumpkinLaughSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="skeletonSound" src="#skeletonSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="vampireSound" src="#vampireSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="werewolfSound" src="#werewolfSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="witchLaughSound" src="#witchLaughSound" sound-autoplay="false" volume="2"></a-sound>
      <a-sound id="zombiSound" src="#zombiSound" sound-autoplay="false" volume="2"></a-sound>

      <a-gltf-model
        src="#village_trees_outer"
        position="0 0 0"
        rotation="0 30 0"
      ></a-gltf-model>
      <a-gltf-model
        src="#village_trees_middle"
        position="0 0 0"
        rotation="0 30 0"
      ></a-gltf-model>
      <a-gltf-model
        src="#village_trees_inner"
        position="0 0 0"
        rotation="0 30 0"
      ></a-gltf-model>

      <a-gltf-model
        src="#village"
        position="0 0 0"
        rotation="0 30 0"
        animation-mixer
      >

        <a-entity light="type:point;color:#f389e1;intensity:0.5;distance:15;penumbra:1" position="0 3 0"></a-entity>

        <a-gltf-model
          id="skeletonTarget"
          src="#skeleton"
          position="7.441 0.802 -0.526"
          rotation="0 -80 0"
          scale="1 1 1"
          class="clickable"
          animation-mixer="clip: idle; crossFadeDuration: 0.5;"
        >
          <a-box
            width="2" depth="0.5" height="2"
            position="0 1 0"
            visible="false"
            class="clickable"
            animation-control="sound: skeleton; target: #skeletonTarget; clip: dance; repetitions: 0; crossFadeDuration: 0.5;"
          >
          </a-box>
        </a-gltf-model>

        <a-gltf-model
          id="zombiTarget"
          src="#zombi"
          position="-0.747 0.665 -9.681"
          rotation="0 0 0"
          scale="1.25 1.25 1.25"
          animation-mixer="clip: idle; crossFadeDuration: 1;"
        >
          <a-box
            width="2" depth="0.5" height="2"
            position="0 1 0"
            visible="false"
            class="clickable"
            animation-control="sound: zombi; target: #zombiTarget; clip: dance; repetitions: 0; crossFadeDuration: 1;"
          >
          </a-box>
        </a-gltf-model>

        <a-entity
          position="-3 0 -6.8"
          rotation="0 25 0"
        >
          <a-gltf-model
            id="pumpkin_happyTarget"
            src="#pumpkin_happy"
            scale="1 1 1"
            class="clickable"
            visible="true"
            animation-mixer
            swap-model="from: #pumpkin_happyTarget; to: #pumpkin_evilTarget; sound: pumpkin_laugh;"
          >
          </a-gltf-model>

          <a-gltf-model
            id="pumpkin_evilTarget"
            src="#pumpkin_evil"
            scale="1 1 1"
            position="0 -10 0"
            visible="true"
          >
          </a-gltf-model>
        </a-entity>

        <a-gltf-model
          id="handTarget"
          src="#hand"
          scale="1 1 1"
          class="clickable"
          visible="true"
          position="-4.35 -0.2 2.85"
          rotation="0 120 0"
          animation-mixer="clip: idle;"
          animation-control="sound: hand; target: #handTarget; clip: animation; repetitions: 0;"
        >
        </a-gltf-model>

        <a-gltf-model
          id="feetTarget"
          src="#feet"
          scale="1 1 1"
          class="clickable"
          visible="true"
          position="-3.8 -0.1 -3.5"
          rotation="0 57 0"
          animation-mixer="clip: idle;"
          animation-control="sound: feet; target: #feetTarget; clip: animation; repetitions: 0;"
        >
        </a-gltf-model>

        <a-gltf-model
          id="vampireTarget"
          src="#vampire"
          class="clickable"
          visible="true"
          position="-5.6 0.04 -0.46"
          rotation="0 83.89 0"
          scale="1 1 1"
          animation-mixer="clip: idle;"
          animation-control="lightOn: #vampireLight; sound: vampire; target: #vampireTarget; clip: animation; repetitions: 0;"
        >
          <a-entity
            id="vampireLight"
            light="type:spot; color:#EE3030; intensity:10;distance:3;penumbra:1"
            position="0.06 0.9 0.9"
            rotation="58.6 -13.3 -24.8"
          >
          </a-entity>
        </a-gltf-model>

        <a-gltf-model
          id="werewolfTarget"
          src="#werewolf"
          class="clickable"
          visible="true"
          position="-3 11 -13"
          scale="1 1 1"
          animation-mixer="clip: idle;"
        >
          <a-box
            position="-0.55 3 2.3"
            width="10.87" height="6.2" depth="1"
            rotation="0 10.53 0"
            visible="false"
            class="clickable"
            animation-control="sound: werewolf; target: #werewolfTarget; clip: animation; repetitions: 0;"
          >
          </a-box>
        </a-gltf-model>

        <a-gltf-model
          id="witchTarget"
          src="#witch"
          scale="1 1 1"
          animation-mixer="clip: idle; crossFadeDuration: 1;"
        >
          <a-box
            width="5" depth="6" height="4"
            position="-16.62 11.17 -1.15"
            visible="false"
            class="clickable"
            animation-control="sound: witch_laugh; target: #witchTarget; clip: animation; repetitions: 0; crossFadeDuration: 1;"
          >
          </a-box>
        </a-gltf-model>

        <a-gltf-model
          id="batTarget"
          src="#bat"
          scale="1 1 1"
          class="clickable"
          visible="true"
          position="0 0 0"
          rotation="0 0 0"
          animation-mixer="clip: idle; crossFadeDuration: 0;"
          animation-control="sound: bat; target: #batTarget; clip: animation; repetitions: 0; crossFadeDuration: 0;"
        >
        </a-gltf-model>

      </a-gltf-model>


    <a-entity id="score" score position="0 1.073 -4.23" scale="5 5 5" rotation="-10.9 0 1.5">
      <a-entity id="scoreValue" text="font:mozillavr; width:0.8; color:#fab80e; align:center; baseline:bottom; wrapCount:15" position="0 0.07 0">
      </a-entity>
      <a-entity id="scoreText" text="font:mozillavr; value: CREEPYZENS FOUND; width:0.8; color:#fab80e; align:center; baseline:top; lineHeight:120" position="0 0 0">
      </a-entity>
      <a-entity id="scoreGameOver" text="font:mozillavr; value: Happy Halloween!; width:0.8; color:#a4ec62; align:center; baseline:top; lineHeight:120" position="0 -0.05 0">
      </a-entity>
    </a-entity>

    </a-scene>
    </template>

    <!-- Scene will be injected here -->
    <div id="scene-container"></div>

    <script>
      // Handle start button click
      document.getElementById('ttff-start-button').addEventListener('click', function() {
        // Hide the overlay
        document.getElementById('ttff-start-overlay').style.display = 'none';
        
        // Inject the a-scene from template
        var template = document.getElementById('scene-template');
        var sceneContent = template.content.cloneNode(true);
        document.getElementById('scene-container').appendChild(sceneContent);
      });
    </script>

    <!-- TTFF Measurement Script -->
    <script src="ttff-measurement-main.js"></script>

  </body>
</html>
