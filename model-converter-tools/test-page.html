<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Reality Museum - GLTF转换测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .content {
            padding: 40px;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .test-section h3 {
            color: #333;
            margin-top: 0;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .log {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .log-entry.success {
            color: #28a745;
        }
        
        .log-entry.error {
            color: #dc3545;
        }
        
        .log-entry.info {
            color: #17a2b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ Virtual Reality Museum</h1>
            <p>GLTF转换测试页面</p>
        </div>
        
        <div class="content">
            <div class="test-section">
                <h3>📋 转换状态检查</h3>
                <div id="statusCheck">
                    <div class="status info">正在检查转换状态...</div>
                </div>
            </div>
            
            <div class="test-section">
                <h3>🔧 GLTF组件测试</h3>
                <button class="btn" onclick="testGLTFComponent()">测试GLTF组件</button>
                <button class="btn" onclick="testCTMFallback()">测试CTM备用加载</button>
                <div id="componentTest">
                    <div class="status info">点击按钮开始测试</div>
                </div>
            </div>
            
            <div class="test-section">
                <h3>📝 测试日志</h3>
                <div class="log" id="testLog">
                    <div class="log-entry info">测试页面已加载</div>
                </div>
            </div>
            
            <div class="test-section">
                <h3>🚀 快速操作</h3>
                <button class="btn" onclick="openOriginalMuseum()">打开原始博物馆</button>
                <button class="btn" onclick="openUpdatedMuseum()">打开更新后的博物馆</button>
                <button class="btn" onclick="viewBackup()">查看备份文件</button>
            </div>
        </div>
    </div>

    <script>
        // 检查转换状态
        async function checkConversionStatus() {
            const statusDiv = document.getElementById('statusCheck');
            const logDiv = document.getElementById('testLog');
            
            logMessage('开始检查转换状态...', 'info');
            
            try {
                // 检查GLTF文件是否存在
                const gltfModels = [
                    'david', 'female_head', 'lion', 'greek_bust', 'old_man', 
                    'nefertiti', 'fractal_1', 'fractal_2', 'fractal_3', 
                    'female_helmet', 'monk_uv', 'david_bike_hall_3'
                ];
                
                let successCount = 0;
                let totalCount = gltfModels.length;
                
                for (const modelName of gltfModels) {
                    try {
                        const response = await fetch(`../realCase/Virtual-Reality-Museum-master/models/${modelName}.gltf`);
                        if (response.ok) {
                            logMessage(`✅ ${modelName}.gltf 文件存在`, 'success');
                            successCount++;
                        } else {
                            logMessage(`❌ ${modelName}.gltf 文件不存在`, 'error');
                        }
                    } catch (error) {
                        logMessage(`❌ ${modelName}.gltf 检查失败: ${error.message}`, 'error');
                    }
                }
                
                // 检查GLTF组件
                try {
                    const componentResponse = await fetch('../realCase/Virtual-Reality-Museum-master/js/gltf-model-component.js');
                    if (componentResponse.ok) {
                        logMessage('✅ GLTF组件文件存在', 'success');
                        successCount++;
                    } else {
                        logMessage('❌ GLTF组件文件不存在', 'error');
                    }
                } catch (error) {
                    logMessage('❌ GLTF组件检查失败', 'error');
                }
                
                // 更新状态显示
                if (successCount >= totalCount) {
                    statusDiv.innerHTML = '<div class="status success">✅ 所有GLTF文件转换完成！</div>';
                } else {
                    statusDiv.innerHTML = `<div class="status error">❌ 转换未完成 (${successCount}/${totalCount + 1})</div>`;
                }
                
            } catch (error) {
                statusDiv.innerHTML = '<div class="status error">❌ 状态检查失败</div>';
                logMessage(`状态检查失败: ${error.message}`, 'error');
            }
        }

        // 测试GLTF组件
        function testGLTFComponent() {
            const testDiv = document.getElementById('componentTest');
            const logDiv = document.getElementById('testLog');
            
            logMessage('开始测试GLTF组件...', 'info');
            
            try {
                // 检查Three.js是否加载
                if (typeof THREE === 'undefined') {
                    testDiv.innerHTML = '<div class="status error">❌ Three.js未加载</div>';
                    logMessage('Three.js未加载，无法测试GLTF组件', 'error');
                    return;
                }
                
                // 检查GLTFLoader是否可用
                if (typeof THREE.GLTFLoader === 'undefined') {
                    testDiv.innerHTML = '<div class="status error">❌ GLTFLoader未加载</div>';
                    logMessage('GLTFLoader未加载', 'error');
                    return;
                }
                
                testDiv.innerHTML = '<div class="status success">✅ GLTF组件依赖检查通过</div>';
                logMessage('GLTF组件依赖检查通过', 'success');
                
            } catch (error) {
                testDiv.innerHTML = '<div class="status error">❌ GLTF组件测试失败</div>';
                logMessage(`GLTF组件测试失败: ${error.message}`, 'error');
            }
        }

        // 测试CTM备用加载
        function testCTMFallback() {
            const testDiv = document.getElementById('componentTest');
            const logDiv = document.getElementById('testLog');
            
            logMessage('开始测试CTM备用加载...', 'info');
            
            try {
                // 检查CTM相关库是否加载
                if (typeof CTM === 'undefined') {
                    testDiv.innerHTML = '<div class="status error">❌ CTM库未加载</div>';
                    logMessage('CTM库未加载，CTM备用功能不可用', 'error');
                    return;
                }
                
                if (typeof THREE.CTMLoader === 'undefined') {
                    testDiv.innerHTML = '<div class="status error">❌ CTMLoader未加载</div>';
                    logMessage('CTMLoader未加载', 'error');
                    return;
                }
                
                testDiv.innerHTML = '<div class="status success">✅ CTM备用加载功能可用</div>';
                logMessage('CTM备用加载功能检查通过', 'success');
                
            } catch (error) {
                testDiv.innerHTML = '<div class="status error">❌ CTM备用测试失败</div>';
                logMessage(`CTM备用测试失败: ${error.message}`, 'error');
            }
        }

        // 打开原始博物馆
        function openOriginalMuseum() {
            window.open('../realCase/Virtual-Reality-Museum-master/index-original.html', '_blank');
            logMessage('打开原始博物馆页面', 'info');
        }

        // 打开更新后的博物馆
        function openUpdatedMuseum() {
            window.open('../realCase/Virtual-Reality-Museum-master/index.html', '_blank');
            logMessage('打开更新后的博物馆页面', 'info');
        }

        // 查看备份文件
        function viewBackup() {
            window.open('../realCase/Virtual-Reality-Museum-master/backup-original/', '_blank');
            logMessage('查看备份文件', 'info');
        }

        // 记录日志
        function logMessage(message, type = 'info') {
            const logContainer = document.getElementById('testLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 页面加载完成后自动检查状态
        document.addEventListener('DOMContentLoaded', function() {
            checkConversionStatus();
        });
    </script>

    <!-- 引入Three.js和相关库用于测试 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>
    <script src="../realCase/Virtual-Reality-Museum-master/js/ctm.js"></script>
    <script src="../realCase/Virtual-Reality-Museum-master/js/CTMLoader.js"></script>
</body>
</html>
